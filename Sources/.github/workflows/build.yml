name: Build IPA
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cai XcodeGen
        run: brew install xcodegen
      - name: Tao project
        run: xcodegen generate
      - name: Build
        run: |
          xcodebuild -project ShopApp.xcodeproj -scheme ShopApp \
            -configuration Release -sdk iphoneos -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY=""
      - name: Dong goi IPA
        run: |
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/ShopApp.app Payload/
          zip -r ShopApp.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShopApp-ipa
          path: ShopApp.ipa